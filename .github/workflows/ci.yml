name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Syntax checks
        run: |
          bash -n install.sh
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Focused regression tests
        run: npm test

      - name: Package contents
        run: |
          npm pack --dry-run --json >/dev/null
          npm pack --workspaces --if-present --dry-run --json >/dev/null

      - name: Production dependency audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
